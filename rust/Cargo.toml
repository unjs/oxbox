[package]
name = "oxbox"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxc_parser_napi = { path = "../vendor/oxc/napi/parser" }
oxc_transform_napi = { path = "../vendor/oxc/napi/transform" }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
